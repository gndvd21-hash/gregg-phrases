<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gregg Phrase Dictionary</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            opacity: 0.8;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #searchInput {
            flex: 1;
            padding: 15px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #555;
        }

        .result-info {
            margin-bottom: 15px;
            color: #666;
        }

        #results {
            display: grid;
            gap: 15px;
        }

        .phrase-card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .phrase-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .phrase-image {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .source {
            font-size: 13px;
            color: #777;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Gregg Phrase Dictionary</h1>
    <p>Gregg Shorthand Phrase Book — Anniversary Edition</p>
</header>

<main>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search a phrase..."
            autocomplete="off"
        >
    </div>

    <div id="resultInfo" class="result-info">
        Loading dictionary...
    </div>

    <div id="results">
        <div class="loading">
            Loading...
        </div>
    </div>

</main>

<script>

    let phrases = [];

    const searchInput = document.getElementById("searchInput");
    const resultsContainer = document.getElementById("results");
    const resultInfo = document.getElementById("resultInfo");

    // Load dictionary
    async function loadDictionary() {

        try {

            const response = await fetch("data/phrases.json");

            if (!response.ok) {
                throw new Error("Dictionary file not found.");
            }

            phrases = await response.json();

            resultInfo.textContent =
                `${phrases.length.toLocaleString()} phrases available`;

            showResults(phrases.slice(0, 50));

        } catch (error) {

            console.error(error);

            resultInfo.textContent = "Dictionary could not be loaded.";

            resultsContainer.innerHTML = `
                <div class="empty">
                    <strong>Dictionary not installed yet.</strong>
                    <br><br>
                    We still need to upload the phrase database.
                </div>
            `;
        }
    }


    // Normalize search text
    function normalize(text) {

        return text
            .toLowerCase()
            .trim()
            .replace(/\s+/g, " ");

    }


    // Search
    function searchPhrases(query) {

        query = normalize(query);

        if (!query) {
            return phrases.slice(0, 50);
        }

        return phrases.filter(item => {

            const phrase = normalize(item.phrase);

            return phrase.includes(query);

        }).slice(0, 100);

    }


    // Display results
    function showResults(items) {

        resultsContainer.innerHTML = "";

        if (items.length === 0) {

            resultsContainer.innerHTML = `
                <div class="empty">
                    No matching phrases found.
                </div>
            `;

            return;
        }


        items.forEach(item => {

            const card = document.createElement("div");

            card.className = "phrase-card";

            card.innerHTML = `

                <div class="phrase-text">
                    ${escapeHTML(item.phrase)}
                </div>

                <img
                    class="phrase-image"
                    src="${item.image}"
                    alt="${escapeHTML(item.phrase)}"
                    loading="lazy"
                >

                <div class="source">
                    Phrase Book — PDF page ${item.source_page}
                </div>

            `;

            resultsContainer.appendChild(card);

        });

    }


    // Prevent HTML injection from OCR text
    function escapeHTML(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // Search while typing
    searchInput.addEventListener("input", function() {

        const query = this.value;

        const matches = searchPhrases(query);

        resultInfo.textContent =
            `${matches.length.toLocaleString()} result(s)`;

        showResults(matches);

    });


    // Start
    loadDictionary();

</script>

</body>
</html>
