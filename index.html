<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Anniversary Phrase Dictionary</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 10px;
}

h1 {
    text-align: center;
    margin: 0 0 15px 0;
}

.search-row {
    display: flex;
    gap: 8px;
}

#searchInput {
    flex: 1;
    height: 36px;
    padding: 8px 10px;
    font-size: 16px;
    border: 1px solid #999;
    border-radius: 7px;
}

button {
    width: 65px;
    border: 1px solid #aaa;
    border-radius: 7px;
    background: white;
    cursor: pointer;
}

button:hover {
    background: #eee;
}

.status {
    text-align: center;
    color: #777;
    margin: 10px 0;
    min-height: 18px;
}

.error {
    color: #b00020;
}

.result {
    background: white;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
}

.result-title {
    font-weight: bold;
    margin-bottom: 4px;
}

.result-page {
    font-size: 13px;
    color: #777;
    margin-bottom: 10px;
}

.gregg-box {
    width: 365px;
    height: 100px;
    position: relative;
    overflow: hidden;
    border: 1px solid #000;
    background: white;
    margin: 0 auto;
}

.gregg-page {
    position: absolute;
    max-width: none;
    height: auto;
    visibility: hidden;
}

.debug-page {
    width: 100%;
    overflow: hidden;
    background: #ddd;
    text-align: center;
}

.debug-page canvas {
    max-width: 100%;
    height: auto;
}

.info {
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.4;
}

</style>
</head>

<body>

<div class="container">

<h1>Gregg Anniversary Phrase Dictionary</h1>

<div class="search-row">

<input
    id="searchInput"
    type="text"
    value="i am"
    placeholder="Enter phrase..."
>

<button id="searchButton">
    Search
</button>

</div>

<div id="status">
    Loading Phrase Book...
</div>

<div id="results"></div>

</div>

<script>

const PDF_URL =
"https://greggshorthand.github.io/phrasebook.pdf";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdf = null;

const pageTextCache = {};

function normalize(text) {

    return (text || "")
        .toLowerCase()
        .replace(/[“”"']/g, "")
        .replace(/[.,:;!?()[\]{}]/g, "")
        .replace(/\s+/g, " ")
        .trim();

}

async function loadPDF() {

    try {

        pdf =
            await pdfjsLib.getDocument({
                url: PDF_URL
            }).promise;

        document.getElementById("status").textContent =
            "Phrase Book loaded.";

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            '<span class="error">' +
            'Could not load Phrase Book.' +
            '</span>';

    }

}

async function getPageItems(pageNumber) {

    if (pageTextCache[pageNumber]) {
        return pageTextCache[pageNumber];
    }

    const page =
        await pdf.getPage(pageNumber);

    const content =
        await page.getTextContent();

    const items = content.items
        .filter(item =>
            item.str &&
            item.str.trim()
        )
        .map(item => {

            const tx =
                item.transform;

            return {

                text: item.str,

                norm: normalize(item.str),

                x: tx[4],

                y: tx[5],

                width:
                    item.width || 0,

                height:
                    Math.abs(tx[3] || tx[0] || 10)

            };

        });

    pageTextCache[pageNumber] =
        items;

    return items;

}

function makeLines(items) {

    const lines = [];

    const LINE_THRESHOLD = 5;

    for (const item of items) {

        let found = null;

        let bestDist = Infinity;

        for (const line of lines) {

            const dist =
                Math.abs(
                    line.y - item.y
                );

            if (
                dist < LINE_THRESHOLD &&
                dist < bestDist
            ) {

                found = line;

                bestDist = dist;

            }

        }

        if (!found) {

            found = {

                y: item.y,

                items: []

            };

            lines.push(found);

        }

        found.items.push(item);

        found.y =
            found.items.reduce(
                (sum, i) => sum + i.y, 0
            ) / found.items.length;

    }

    for (const line of lines) {

        line.items.sort(
            (a,b) => a.x - b.x
        );

        line.text =
            normalize(
                line.items
                    .map(item => item.text)
                    .join(" ")
            );

        line.x1 =
            Math.min(
                ...line.items.map(
                    item => item.x
                )
            );

        line.x2 =
            Math.max(
                ...line.items.map(
                    item =>
                        item.x + item.width
                )
            );

        line.y1 =
            Math.min(
                ...line.items.map(
                    item =>
                        item.y - item.height
                )
            );

        line.y2 =
            Math.max(
                ...line.items.map(
                    item => item.y
                )
            );

    }

    return lines;

}

function evaluateLine(line, wanted, pageNumber) {

    if (
        !line.text.includes(wanted)
    ) {

        return null;

    }

    let score = 0;

    if (
        line.text === wanted
    ) {

        score += 10000;

    }

    if (
        line.text.startsWith(wanted)
    ) {

        score += 1000;

    }

    score -=
        (line.text.length -
        wanted.length) * 10;

    if (
        pageNumber >= 10
    ) {

        score += 500;

    }

    const matching =
        findMatchingItems(
            line.items,
            wanted
        );

    if (
        matching.length === 0
    ) {

        return null;

    }

    const phraseX1 =
        Math.min(
            ...matching.map(
                item => item.x
            )
        );

    const phraseX2 =
        Math.max(
            ...matching.map(
                item =>
                    item.x +
                    item.width
            )
        );

    const phraseY1 =
        Math.min(
            ...matching.map(
                item =>
                    item.y -
                    item.height
            )
        );

    const phraseY2 =
        Math.max(
            ...matching.map(
                item => item.y
            )
        );

    return {

        page:
            pageNumber,

        line,

        matching,

        x1:
            phraseX1,

        x2:
            phraseX2,

        y1:
            phraseY1,

        y2:
            phraseY2,

        score

    };

}

async function findPhrase(phrase) {

    const wanted =
        normalize(phrase);

    const candidates = [];

    for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
    ) {

        const items =
            await getPageItems(pageNumber);

        const lines =
            makeLines(items);

        for (const line of lines) {

            const candidate =
                evaluateLine(
                    line,
                    wanted,
                    pageNumber
                );

            if (candidate) {

                candidates.push(candidate);

            }

        }

        const sortedLines =
            [...lines].sort(
                (a, b) => b.y - a.y
            );

        for (
            let i = 0;
            i < sortedLines.length - 1;
            i++
        ) {

            const lineA =
                sortedLines[i];

            const lineB =
                sortedLines[i + 1];

            const combinedLine = {

                text:
                    normalize(
                        lineA.text + " " +
                        lineB.text
                    ),

                items:
                    [...lineA.items, ...lineB.items]

            };

            const candidate =
                evaluateLine(
                    combinedLine,
                    wanted,
                    pageNumber
                );

            if (candidate) {

                candidate.score -= 200;

                candidates.push(candidate);

            }

        }

    }

    candidates.sort(
        (a,b) =>
            b.score - a.score
    );

    return candidates[0] || null;

}

function findMatchingItems(
    items,
    wanted
) {

    const targetWords =
        wanted.split(" ");

    for (
        let start = 0;
        start < items.length;
        start++
    ) {

        let combined = "";

        const selected = [];

        for (
            let i = start;
            i < items.length;
            i++
        ) {

            const text =
                normalize(
                    items[i].text
                );

            if (!text) {
                continue;
            }

            combined =
                combined
                    ? combined + " " + text
                    : text;

            selected.push(
                items[i]
            );

            if (
                combined === wanted
            ) {

                return selected;

            }

            if (
                combined.length >
                wanted.length + 10
            ) {

                break;

            }

        }

    }

    for (const item of items) {

        if (
            normalize(item.text) === wanted
        ) {

            return [item];

        }

    }

    const result = [];

    for (const item of items) {

        if (
            normalize(item.text)
                .includes(wanted)
        ) {

            result.push(item);

            break;

        }

    }

    return result;

}

async function createResultImage(
    candidate
) {

    const page =
        await pdf.getPage(
            candidate.page
        );

    const scale = 3;

    const viewport =
        page.getViewport({
            scale: scale
        });

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        Math.ceil(viewport.width);

    canvas.height =
        Math.ceil(viewport.height);

    const context =
        canvas.getContext("2d");

    await page.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;

    const p1 =
        viewport.convertToViewportPoint(
            candidate.x1,
            candidate.y2
        );

    const p2 =
        viewport.convertToViewportPoint(
            candidate.x2,
            candidate.y1
        );

    const phraseLeft =
        Math.min(
            p1[0],
            p2[0]
        );

    const phraseRight =
        Math.max(
            p1[0],
            p2[0]
        );

    const phraseTop =
        Math.min(
            p1[1],
            p2[1]
        );

    const phraseBottom =
        Math.max(
            p1[1],
            p2[1]
        );

    const phraseWidth =
        phraseRight -
        phraseLeft;

    const phraseHeight =
        phraseBottom -
        phraseTop;

    let cropLeft =
        phraseLeft -
        Math.max(
            180,
            phraseWidth * 2.0
        );

    let cropRight =
        phraseLeft +
        Math.max(
            30,
            phraseWidth * 0.15
        );

    let cropTop =
        phraseTop -
        Math.max(
            25,
            phraseHeight
        );

    let cropBottom =
        phraseBottom +
        Math.max(
            25,
            phraseHeight
        );

    if (
        candidate.page <= 10
    ) {

        cropLeft =
            phraseRight -
            10;

        cropRight =
            phraseRight +
            Math.max(
                150,
                phraseWidth * 2.5
            );

    }

    cropLeft =
        Math.max(
            0,
            cropLeft
        );

    cropTop =
        Math.max(
            0,
            cropTop
        );

    cropRight =
        Math.min(
            canvas.width,
            cropRight
        );

    cropBottom =
        Math.min(
            canvas.height,
            cropBottom
        );

    const cropWidth =
        cropRight -
        cropLeft;

    const cropHeight =
        cropBottom -
        cropTop;

    const cropCanvas =
        document.createElement(
            "canvas"
        );

    cropCanvas.width =
        Math.ceil(cropWidth);

    cropCanvas.height =
        Math.ceil(cropHeight);

    const cropContext =
        cropCanvas.getContext(
            "2d"
        );

    cropContext.drawImage(

        canvas,

        cropLeft,
        cropTop,

        cropWidth,
        cropHeight,

        0,
        0,

        cropWidth,
        cropHeight

    );

    const box =
        document.createElement(
            "div"
        );

    box.className =
        "gregg-box";

    const image =
        document.createElement(
            "img"
        );

    image.className =
        "gregg-page";

    image.src =
        cropCanvas.toDataURL(
            "image/png"
        );

    image.onload =
        function() {

            const targetWidth =
                365;

            const targetHeight =
                100;

            const sx =
                targetWidth /
                cropCanvas.width;

            const sy =
                targetHeight /
                cropCanvas.height;

            const displayScale =
                Math.max(
                    sx,
                    sy
                );

            image.style.width =
                Math.round(
                    cropCanvas.width *
                    displayScale
                ) + "px";

            image.style.height =
                Math.round(
                    cropCanvas.height *
                    displayScale
                ) + "px";

            image.style.left =
                Math.round(
                    (targetWidth -
                    cropCanvas.width *
                    displayScale) / 2
                ) + "px";

            image.style.top =
                Math.round(
                    (targetHeight -
                    cropCanvas.height *
                    displayScale) / 2
                ) + "px";

            image.style.visibility =
                "visible";

        };

    box.appendChild(
        image
    );

    return {

        box,

        x:
            Math.round(candidate.x1),

        y:
            Math.round(candidate.y1),

        width:
            Math.round(
                candidate.x2 -
                candidate.x1
            ),

        height:
            Math.round(
                candidate.y2 -
                candidate.y1
            )

    };

}

async function searchPhrase() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const status =
        document.getElementById(
            "status"
        );

    const results =
        document.getElementById(
            "results"
        );

    const phrase =
        normalize(
            input.value
        );

    results.innerHTML = "";

    if (!phrase) {

        status.textContent =
            "Enter a phrase.";

        return;

    }

    if (!pdf) {

        status.textContent =
            "Phrase Book is still loading.";

        return;

    }

    status.textContent =
        "Searching...";

    try {

        const candidate =
            await findPhrase(
                phrase
            );

        if (!candidate) {

            status.textContent =
                "Phrase not found.";

            return;

        }

        const result =
            document.createElement(
                "div"
            );

        result.className =
            "result";

        const title =
            document.createElement(
                "div"
            );

        title.className =
            "result-title";

        title.textContent =
            "Found phrase: " +
            phrase;

        const page =
            document.createElement(
                "div"
            );

        page.className =
            "result-page";

        page.textContent =
            "PDF page " +
            candidate.page;

        result.appendChild(
            title
        );

        result.appendChild(
            page
        );

        const rendered =
            await createResultImage(
                candidate
            );

        result.appendChild(
            rendered.box
        );

        const info =
            document.createElement(
                "div"
            );

        info.className =
            "info";

        info.innerHTML =

            "<b>Phrase:</b> " +
            phrase +

            "<br>" +

            "<b>Page:</b> " +
            candidate.page +

            "<br>" +

            "<b>X:</b> " +
            rendered.x +

            "<br>" +

            "<b>Y:</b> " +
            rendered.y +

            "<br>" +

            "<b>Width:</b> " +
            rendered.width +

            "<br>" +

            "<b>Height:</b> " +
            rendered.height;

        result.appendChild(
            info
        );

        results.appendChild(
            result
        );

        status.textContent =
            "Phrase found!";

    }

    catch (error) {

        console.error(error);

        status.innerHTML =
            '<span class="error">' +
            "Search error." +
            "</span>";

    }

}

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        searchPhrase
    );

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchPhrase();

            }

        }
    );

loadPDF();

</script>

</body>
</html>
